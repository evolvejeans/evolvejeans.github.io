<style>
  :root{
    --bg:#0b0b0b;
    --card:#151515;
    --card-2:#1c1c1c;
    --line:rgba(232,184,90,.28);
    --gold-1:#f7d27a;
    --gold-2:#e2a93b;
    --gold-3:#b9822a;
    --text:#f5f2ea;
    --muted:#a8a294;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 70% 45% at 50% 0%, rgba(226,169,59,.16), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 110%, rgba(226,169,59,.08), transparent 70%);
    color:var(--text);
    font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;justify-content:center;
  }
  main{
    width:100%;max-width:440px;
    padding:56px 20px 32px;
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;
  }
  .logo{
    width:190px;height:190px;border-radius:50%;
    box-shadow:0 0 0 1px rgba(247,210,122,.15), 0 18px 50px rgba(226,169,59,.22);
    animation:rise .7s ease both;
  }
  h1{
    margin-top:22px;font-size:15px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;
    background:linear-gradient(90deg,var(--gold-1),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:rise .7s .08s ease both;
  }
  .tagline{margin-top:8px;font-size:13px;color:var(--muted);animation:rise .7s .12s ease both}

  .links{width:100%;margin-top:36px;display:flex;flex-direction:column;gap:14px}

  .btn{
    width:100%;display:flex;align-items:center;gap:14px;
    padding:18px 18px;border-radius:16px;
    background:var(--card);border:1px solid var(--line);
    color:var(--text);text-decoration:none;font:inherit;font-size:16px;font-weight:600;
    cursor:pointer;text-align:left;
    transition:transform .15s ease, border-color .2s ease, background .2s ease;
    animation:rise .7s ease both;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:rgba(247,210,122,.6);background:var(--card-2)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--gold-1);outline-offset:3px}
  .btn .ico{
    flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--gold-1),var(--gold-3));color:#141414;
  }
  .btn .ico svg{width:22px;height:22px}
  .btn .label{flex:1;display:flex;flex-direction:column;gap:3px}
  .btn .label small{font-size:12px;font-weight:500;color:var(--muted)}
  .btn .chev{flex:none;width:20px;height:20px;color:var(--gold-2);transition:transform .25s ease}
  .btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .btn[aria-expanded="true"]{border-color:rgba(247,210,122,.6)}

  .sub{
    display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;
  }
  .sub.open{grid-template-rows:1fr}
  .sub > div{overflow:hidden;display:flex;flex-direction:column;gap:10px}
  .sub.open > div{padding-top:10px}
  .sub a{
    display:flex;align-items:center;gap:12px;
    margin-left:18px;padding:15px 16px;border-radius:14px;
    background:transparent;border:1px solid var(--line);
    color:var(--text);text-decoration:none;font-size:15px;font-weight:500;
    transition:background .2s ease,border-color .2s ease,transform .15s ease;
  }
  .sub a:hover{background:var(--card);border-color:rgba(247,210,122,.6)}
  .sub a:active{transform:scale(.98)}
  .sub a .dot{width:8px;height:8px;border-radius:50%;background:var(--gold-2);flex:none}
  .sub a span.t{flex:1}
  .sub a svg{width:18px;height:18px;color:var(--gold-2);flex:none}

  .btn.whats .ico{background:linear-gradient(135deg,#3ee07a,#1fa855);color:#fff}

  footer{margin-top:auto;padding-top:44px;font-size:11px;color:#6f6a60;letter-spacing:.06em;text-align:center}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
